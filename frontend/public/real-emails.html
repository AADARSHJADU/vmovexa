<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VMOVEXA Real Email Templates Inspector</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #090d16; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    header { background: #111827; border-bottom: 1px solid #1f2937; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; }
    .badge { background: #2563eb; color: #fff; font-weight: 800; font-size: 11px; padding: 4px 10px; border-radius: 6px; text-transform: uppercase; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .tab-btn { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 7px 14px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .tab-btn:hover { background: #334155; color: #fff; }
    .tab-btn.active { background: #2563eb; color: #fff; border-color: #3b82f6; }
    .view-controls { display: flex; gap: 8px; align-items: center; }
    .view-btn { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; padding: 6px 12px; border-radius: 6px; font-size: 11px; cursor: pointer; }
    .view-btn.active { background: #475569; color: #fff; }
    .main-stage { flex: 1; display: flex; justify-content: center; align-items: center; background: #0f172a; padding: 20px; overflow: hidden; }
    .frame-wrapper { width: 100%; max-width: 650px; height: 100%; background: transparent; transition: max-width 0.3s ease; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-radius: 12px; overflow: hidden; }
    .frame-wrapper.mobile { max-width: 390px; }
    iframe { width: 100%; height: 100%; border: none; background: #0f172a; }
  </style>
</head>
<body>
  <header>
    <div style="display: flex; align-items: center; gap: 12px;">
      <span class="badge">VMOVEXA Project Emails</span>
      <span style="font-size: 13px; font-weight: 600; color: #cbd5e1;">Actual Backend Generated Emails (Nodemailer / TemplateEngine)</span>
    </div>
    <div class="tabs">
      <button class="tab-btn active" onclick="loadEmail('/emails/campaign_payment_link.html', this)">Campaign Approved & Payment Link</button><button class="tab-btn " onclick="loadEmail('/emails/user_provisioning.html', this)">User Account Provisioned & Credentials</button><button class="tab-btn " onclick="loadEmail('/emails/otp_verification.html', this)">Email OTP Verification Code</button><button class="tab-btn " onclick="loadEmail('/emails/payment_confirmed.html', this)">Payment Confirmed & Campaign Live</button><button class="tab-btn " onclick="loadEmail('/emails/tenant_approved.html', this)">Tenant Organization Application Approved</button>
    </div>
    <div class="view-controls">
      <button class="view-btn active" id="btn-desktop" onclick="setDevice('desktop')">💻 Desktop (650px)</button>
      <button class="view-btn" id="btn-mobile" onclick="setDevice('mobile')">📱 Mobile (390px)</button>
    </div>
  </header>
  <div class="main-stage">
    <div class="frame-wrapper" id="frame-wrapper">
      <iframe id="email-frame" src="/emails/campaign_payment_link.html"></iframe>
    </div>
  </div>
  <script>
    function loadEmail(url, el) {
      document.getElementById('email-frame').src = url;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
    }
    function setDevice(type) {
      const wrap = document.getElementById('frame-wrapper');
      const btnDesk = document.getElementById('btn-desktop');
      const btnMob = document.getElementById('btn-mobile');
      if (type === 'mobile') {
        wrap.classList.add('mobile');
        btnMob.classList.add('active');
        btnDesk.classList.remove('active');
      } else {
        wrap.classList.remove('mobile');
        btnDesk.classList.add('active');
        btnMob.classList.remove('active');
      }
    }
  </script>
</body>
</html>
